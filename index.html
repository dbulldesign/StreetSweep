<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="StreetSweep — interactive NYC Alternate Side Parking (street cleaning) and parking-rules map.">
<title>StreetSweep — NYC Street Cleaning &amp; Parking Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin=""/>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2; --accent:#ffb020; --accent2:#4ea1ff;
    --good:#35c07a; --bad:#ff5c5c; --radius:14px;
    font-synthesis:none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex; flex-direction:column; height:100dvh;}
  header{padding:10px 14px; padding-top:max(10px,env(safe-area-inset-top)); background:var(--panel);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:10;}
  header .logo{width:30px;height:30px;flex:0 0 auto;}
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.2px;}
  header p{margin:1px 0 0; font-size:11px; color:var(--muted);}
  .statuspill{margin-left:auto; font-size:11px; padding:5px 9px; border-radius:20px;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .statuspill b{color:var(--txt);}
  #map{flex:1; width:100%; background:#20242e;}
  .leaflet-container{background:#20242e;}
  /* controls */
  .fab{position:absolute; z-index:500; border:none; cursor:pointer;
    background:var(--accent); color:#111; font-weight:700; border-radius:50%;
    width:52px;height:52px; box-shadow:0 4px 14px rgba(0,0,0,.5); font-size:22px;
    display:flex; align-items:center; justify-content:center;}
  .fab:active{transform:scale(.94);}
  #locBtn{right:14px; bottom:160px;}
  #searchBtn{right:14px; bottom:222px; background:var(--accent2); color:#fff; font-size:20px;}
  /* bottom sheet */
  #sheet{position:absolute; left:0; right:0; bottom:0; z-index:600;
    background:var(--panel); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.4);
    max-height:70dvh; display:flex; flex-direction:column;
    transform:translateY(calc(100% - 132px));
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding-bottom:env(safe-area-inset-bottom);}
  #sheet.open{transform:translateY(0);}
  #sheet.dragging{transition:none;}
  .grip{width:40px;height:5px;background:var(--line);border-radius:3px;margin:9px auto 4px;flex:0 0 auto;}
  .sheet-head{padding:2px 16px 10px; cursor:grab; flex:0 0 auto; touch-action:none; user-select:none;}
  .sheet-head:active{cursor:grabbing;}
  .sheet-head h2{margin:2px 0; font-size:16px;}
  .sheet-head .sub{font-size:12px;color:var(--muted);}
  .sheet-body{padding:0 16px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px;}
  .card h3{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);}
  .row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--muted); flex:0 0 96px; font-size:12.5px;}
  .row .v{font-weight:600;}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;}
  .b-clean{background:rgba(255,176,32,.16); color:var(--accent);}
  .b-good{background:rgba(53,192,122,.16); color:var(--good);}
  .b-bad{background:rgba(255,92,92,.16); color:var(--bad);}
  .daychips{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px;}
  .chip{font-size:11px; padding:5px 8px; border-radius:8px; background:#0f1218; border:1px solid var(--line); color:var(--muted); min-width:34px; text-align:center;}
  .chip.on{background:var(--accent); color:#111; border-color:var(--accent); font-weight:700;}
  .chip.today{outline:2px solid var(--accent2); outline-offset:1px;}
  .todaybar{display:flex; gap:10px; padding:11px 13px; border-radius:var(--radius); margin-bottom:10px; align-items:center;}
  .todaybar.susp{background:rgba(53,192,122,.12); border:1px solid rgba(53,192,122,.4);}
  .todaybar.active{background:rgba(255,176,32,.10); border:1px solid rgba(255,176,32,.35);}
  .todaybar .big{font-size:26px;line-height:1;}
  .todaybar .t1{font-weight:700;font-size:14px;}
  .todaybar .t2{font-size:12px;color:var(--muted);margin-top:2px;}
  .muted{color:var(--muted);font-size:12px;line-height:1.5;}
  a{color:var(--accent2);}
  /* search modal */
  .modal{position:absolute; inset:0; z-index:900; background:rgba(0,0,0,.5);
    display:none; align-items:flex-start; justify-content:center; padding-top:80px;}
  .modal.show{display:flex;}
  .modalbox{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:92%; max-width:440px; padding:16px; max-height:70dvh; overflow-y:auto;}
  .modalbox input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel2); color:var(--txt); font-size:15px;}
  .cal-item{display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px; align-items:center;}
  .cal-item.past{opacity:.45;}
  .cal-item .date{flex:0 0 82px; color:var(--accent); font-weight:700;}
  .legend{position:absolute; left:12px; bottom:14px; z-index:500; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:11px; color:var(--muted);}
  .legend .li{display:flex;align-items:center;gap:6px;margin:2px 0;}
  .swatch{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .toast{position:absolute; left:50%; top:70px; transform:translateX(-50%); z-index:1000;
    background:#000; color:#fff; padding:9px 15px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; max-width:88%; text-align:center;}
  .toast.show{opacity:.95;}
  .btn{display:inline-block;width:100%;text-align:center;padding:11px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;
    font-weight:600;cursor:pointer;margin-top:6px;text-decoration:none;}
  .btn.primary{background:var(--accent);color:#111;border-color:var(--accent);}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#ffb020"/><path d="M13 27V13h5.5a4.5 4.5 0 0 1 0 9H13" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>StreetSweep</h1>
      <p id="datestr">Loading…</p>
    </div>
    <div class="statuspill" id="statuspill">Tap map for a block</div>
  </header>

  <div id="map"></div>

  <button class="fab" id="searchBtn" title="2026 suspension calendar" aria-label="Open suspension calendar">📅</button>
  <button class="fab" id="locBtn" title="Find me" aria-label="Find my location">📍</button>

  <div class="legend" aria-hidden="true">
    <div class="li"><span class="swatch" style="background:#ffb020"></span> Selected block</div>
    <div class="li"><span class="swatch" style="background:#4ea1ff"></span> You are here</div>
  </div>

  <div id="sheet">
    <div class="grip"></div>
    <div class="sheet-head" id="sheetHead">
      <h2 id="sheetTitle">Today in NYC</h2>
      <div class="sub" id="sheetSub">Drag this handle up • tap 📍 or the map</div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="modal" id="calModal">
    <div class="modalbox">
      <h2 style="margin:0 0 10px;font-size:16px;">2026 ASP Suspension Calendar</h2>
      <input id="calSearch" placeholder="Search a holiday or month…" autocomplete="off">
      <div id="calList" style="margin-top:12px;"></div>
      <div class="btn" id="calClose" style="margin-top:14px;">Close</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script>
/* ============================================================
   StreetSweep — NYC Street Cleaning (ASP) & Parking Map
   Single-file app. Only external dependency: Leaflet (CDN).

   Data sources:
   - Per-block cleaning schedule: NYC Open Data (DSNY) live Socrata
     API, queried on demand. Graceful fallback if unreachable
     (e.g. when opened as file:// or offline).
   - Suspension calendar: NYC DSNY 2026 planned ASP suspensions.

   Real-time weather/emergency suspensions are intentionally NOT
   fabricated — no reliable public API exists. The app links to
   NYC311 and Notify NYC as authoritative sources.
   ============================================================ */

/* ---------- 2026 ASP planned suspension calendar (DSNY) ---------- */
const SUSPENSIONS_2026 = [
  ["2026-01-01","New Year's Day"],
  ["2026-01-06","Three Kings' Day"],
  ["2026-01-19","Martin Luther King Jr. Day"],
  ["2026-02-16","Presidents' Day"],
  ["2026-02-17","Lunar New Year"],
  ["2026-02-18","Ash Wednesday"],
  ["2026-03-20","Eid al-Fitr (begins)"],
  ["2026-03-21","Eid al-Fitr"],
  ["2026-04-02","Passover (1st Day)"],
  ["2026-04-02","Holy Thursday"],
  ["2026-04-03","Passover (2nd Day)"],
  ["2026-04-03","Good Friday"],
  ["2026-04-09","Passover (7th Day)"],
  ["2026-04-10","Passover (8th Day)"],
  ["2026-04-10","Holy Thursday (Orthodox)"],
  ["2026-04-11","Good Friday (Orthodox)"],
  ["2026-05-14","Solemnity of the Ascension"],
  ["2026-05-22","Shavuot (1st Day)"],
  ["2026-05-23","Shavuot (2nd Day)"],
  ["2026-05-25","Memorial Day"],
  ["2026-05-27","Eid al-Adha (begins)"],
  ["2026-05-28","Eid al-Adha"],
  ["2026-06-19","Juneteenth"],
  ["2026-07-03","Independence Day (observed)"],
  ["2026-07-04","Independence Day"],
  ["2026-08-15","Feast of the Assumption"],
  ["2026-09-07","Labor Day"],
  ["2026-09-12","Rosh Hashanah (1st Day)"],
  ["2026-09-13","Rosh Hashanah (2nd Day)"],
  ["2026-09-21","Yom Kippur"],
  ["2026-09-26","Sukkot (1st Day)"],
  ["2026-09-27","Sukkot (2nd Day)"],
  ["2026-10-03","Shemini Atzeret"],
  ["2026-10-04","Simchat Torah"],
  ["2026-10-12","Italian Heritage / Indigenous Peoples' Day"],
  ["2026-11-01","All Saints' Day"],
  ["2026-11-11","Veterans Day"],
  ["2026-11-26","Thanksgiving Day"],
  ["2026-12-08","Immaculate Conception"],
  ["2026-12-25","Christmas Day"],
];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const toast = (msg,ms=2600)=>{const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms);};
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtDate = d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
// Local-date ISO (avoid UTC shift from toISOString)
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function suspensionFor(dateStr){
  return SUSPENSIONS_2026.filter(s=>s[0]===dateStr).map(s=>s[1]);
}

/* ---------- Map setup ---------- */
const NYC = [40.7308,-73.9975];
const map = L.map("map",{zoomControl:false, attributionControl:false}).setView(NYC,13);
L.control.zoom({position:"topright"}).addTo(map);
L.control.attribution({position:"topleft",prefix:false})
  .addAttribution('© OpenStreetMap · © CARTO · DSNY/NYC Open Data').addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  maxZoom:19, subdomains:"abcd"
}).addTo(map);

let userMarker=null, userCircle=null, pickMarker=null;
let segLayer = L.layerGroup().addTo(map);

/* ---------- Today panel ---------- */
function renderToday(){
  const now = new Date();
  $("#datestr").textContent = fmtDate(now);
  const susp = suspensionFor(iso(now));
  const dow = now.getDay();
  const isSunday = dow===0;
  let html = "";

  if(susp.length){
    html += `<div class="todaybar susp"><div class="big">✅</div><div>
      <div class="t1">ASP is SUSPENDED today (planned)</div>
      <div class="t2">${esc(susp.join(" · "))} — you don't have to move for street cleaning.</div>
    </div></div>`;
  } else if(isSunday){
    html += `<div class="todaybar susp"><div class="big">🅿️</div><div>
      <div class="t1">Sunday — no street cleaning</div>
      <div class="t2">ASP is never in effect on Sundays. Meters are also free.</div>
    </div></div>`;
  } else {
    html += `<div class="todaybar active"><div class="big">🧹</div><div>
      <div class="t1">Normal cleaning rules in effect today</div>
      <div class="t2">No planned citywide suspension. Check your block's posted hours below.</div>
    </div></div>`;
  }

  // next planned suspension + countdown
  const today0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const future = SUSPENSIONS_2026.filter(s=>s[0]>=iso(now)).sort((a,b)=>a[0].localeCompare(b[0]));
  if(future.length){
    const n = future[0];
    const nd = new Date(n[0]+"T12:00");
    const nd0 = new Date(nd.getFullYear(),nd.getMonth(),nd.getDate());
    const days = Math.round((nd0-today0)/86400000);
    html += `<div class="card"><h3>Next planned suspension</h3>
      <div class="row"><span class="k">Date</span><span class="v">${nd.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</span></div>
      <div class="row"><span class="k">Occasion</span><span class="v">${esc(n[1])}</span></div>
      <div class="row"><span class="k">Countdown</span><span class="v">${days===0?"today":"in "+days+" day"+(days>1?"s":"")}</span></div>
    </div>`;
  } else {
    html += `<div class="card"><h3>Next planned suspension</h3>
      <div class="muted">No further planned citywide suspensions listed for 2026.</div></div>`;
  }

  html += `<div class="card"><h3>⚠️ Live cancellations (weather/emergency)</h3>
    <div class="muted">Same-day suspensions for snow or emergencies aren't in any reliable public feed. The city posts the official daily status just after midnight. On a suspension-prone day, always confirm:</div>
    <a class="btn" href="https://portal.311.nyc.gov/article/?kanumber=KA-01011" target="_blank" rel="noopener">Check NYC311 ASP status →</a>
    <a class="btn" href="https://a858-nycnotify.nyc.gov/notifynyc/" target="_blank" rel="noopener">Sign up for Notify NYC alerts →</a>
  </div>`;

  html += `<div class="muted" style="padding:2px 2px 10px;">Tap 📍 to locate yourself, or tap any street on the map to see its cleaning schedule and parking rules.</div>`;

  $("#sheetTitle").textContent = "Today in NYC";
  $("#sheetSub").textContent = fmtDate(now);
  $("#sheetBody").innerHTML = html;
  $("#statuspill").innerHTML = susp.length ? '<b style="color:var(--good)">Suspended</b> today'
    : isSunday ? '<b>Sunday</b> · no ASP' : '<b style="color:var(--accent)">Active</b> today';
}

/* ---------- Parse a schedule string into day flags ---------- */
function parseDays(str){
  if(!str) return [false,false,false,false,false,false,false];
  const map={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6,
    SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  const flags=[false,false,false,false,false,false,false];
  const up=str.toUpperCase();
  // Longer keys first so "SUN" wins before "SU", etc.
  ["SUN","MON","TUE","WED","THU","FRI","SAT","SU","MO","TU","WE","TH","FR","SA"]
    .forEach(k=>{ if(up.includes(k)) flags[map[k]]=true; });
  return flags;
}

/* ---------- Fetch nearby cleaning segments from NYC Open Data ---------- */
// DSNY street cleaning schedule dataset. If unreachable / schema differs,
// we fall back to a generic lookup card.
async function loadNearby(lat,lng){
  segLayer.clearLayers();
  pickMarker = L.circleMarker([lat,lng],{radius:7,color:"#ffb020",fillColor:"#ffb020",fillOpacity:.9,weight:2}).addTo(segLayer);

  // Show an immediate loading state so the tap feels responsive.
  renderBlock(lat,lng,null,null,true);

  let seg=null, err=null;
  try{
    const url = "https://data.cityofnewyork.us/resource/w48c-6bhp.json"
      + "?$where=within_circle(the_geom," + lat + "," + lng + ",120)&$limit=8";
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 7000);
    const r = await fetch(url,{signal:ctrl.signal});
    clearTimeout(to);
    if(r.ok){
      const rows = await r.json();
      if(Array.isArray(rows) && rows.length) seg = rows;
    } else {
      err = new Error("HTTP "+r.status);
    }
  }catch(e){ err=e; }

  renderBlock(lat,lng,seg,err,false);
}

function scheduleCardFromRow(row){
  // Try common column names across DSNY schedule datasets.
  const days = row.day || row.days || row.dayofweek || row.sweep_days || row.schedule || "";
  const from = row.fromhour || row.from_hour || row.starttime || row.begin || "";
  const to   = row.tohour   || row.to_hour   || row.endtime   || row.end   || "";
  const side = row.side || row.sideofstreet || row.side_of_street || row.street_side || "";
  const on   = row.onstreet || row.on_street || row.street || row.stname || "";
  return {days,from,to,side,on};
}

function renderBlock(lat,lng,seg,err,loading){
  const now=new Date();
  const dow=now.getDay();
  let html="";
  const susp = suspensionFor(iso(now));

  html += `<div class="card"><h3>Location</h3>
    <div class="row"><span class="k">Coords</span><span class="v">${lat.toFixed(5)}, ${lng.toFixed(5)}</span></div>
    <a class="btn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${lat},${lng}">Open in Google Maps →</a>
  </div>`;

  if(loading){
    html += `<div class="card"><h3>Cleaning schedule</h3>
      <div class="muted"><span class="spin"></span>Looking up the nearest mapped cleaning segments from NYC Open Data…</div>
    </div>`;
  } else if(seg && seg.length){
    seg.slice(0,4).forEach((row,i)=>{
      const s = scheduleCardFromRow(row);
      const flags = parseDays(s.days);
      const chips = DAYS.map((d,idx)=>`<span class="chip ${flags[idx]?'on':''} ${idx===dow?'today':''}">${d}</span>`).join("");
      const activeToday = flags[dow] && !susp.length && dow!==0;
      html += `<div class="card">
        <h3>Cleaning schedule ${seg.length>1?("· side "+(i+1)):""}</h3>
        ${s.on?`<div class="row"><span class="k">Street</span><span class="v">${esc(s.on)}</span></div>`:""}
        ${s.side?`<div class="row"><span class="k">Side</span><span class="v">${esc(s.side)}</span></div>`:""}
        <div class="row"><span class="k">Days</span><span class="v">${esc(s.days||"See sign")}</span></div>
        ${(s.from||s.to)?`<div class="row"><span class="k">Hours</span><span class="v">${esc(s.from||"?")} – ${esc(s.to||"?")}</span></div>`:""}
        <div class="daychips">${chips}</div>
        <div style="margin-top:9px">${
          susp.length ? '<span class="badge b-good">Suspended today</span>'
          : dow===0 ? '<span class="badge b-good">Sunday · no cleaning</span>'
          : activeToday ? '<span class="badge b-clean">Cleaning day is TODAY</span>'
          : '<span class="badge b-good">Not a cleaning day today</span>'}</div>
      </div>`;
    });
  } else {
    html += `<div class="card"><h3>Cleaning schedule</h3>
      <div class="muted">${err? "Couldn't reach the live NYC Open Data feed (network/CORS — this is expected when opened as a local file). "
        : "No mapped cleaning segment was returned for this exact point. "}
      NYC's per-block signs are the legal source of truth — schedules vary block to block and even by side of street.</div>
      <div class="daychips" style="margin-top:8px">${DAYS.map((d,idx)=>`<span class="chip ${idx===dow?'today':''}">${d}</span>`).join("")}</div>
      <a class="btn" target="_blank" rel="noopener" href="https://www.nyc.gov/site/dsny/what-we-do/cleaning/street-cleaning-asp.page">DSNY street cleaning info →</a>
    </div>`;
  }

  // General parking rules reference
  html += `<div class="card"><h3>Standard NYC parking rules</h3>
    <div class="row"><span class="k">Cleaning</span><span class="v">Move car during posted window</span></div>
    <div class="row"><span class="k">Sundays</span><span class="v">No ASP · meters free</span></div>
    <div class="row"><span class="k">Sitting in car</span><span class="v">Not exempt — must move</span></div>
    <div class="row"><span class="k">Return</span><span class="v">OK only after end time</span></div>
    <div class="row"><span class="k">Fine</span><span class="v">$65 (Manhattan ≤96th St) · $45 elsewhere</span></div>
  </div>`;

  html += `<div class="muted" style="padding:2px 2px 8px">Always defer to the physical sign on the curb — it is the enforceable rule.</div>`;

  $("#sheetTitle").textContent = "This block";
  $("#sheetSub").textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  $("#sheetBody").innerHTML = html;
  openSheet();
}

/* ---------- Draggable bottom sheet ---------- */
const sheet = $("#sheet");
const PEEK = 132; // px of sheet visible when collapsed (matches CSS translateY)
let sheetOpen = false;

function sheetHeight(){ return sheet.getBoundingClientRect().height; }
function openSheet(){ sheet.classList.add("open"); sheet.style.transform=""; sheetOpen=true; }
function closeSheet(){ sheet.classList.remove("open"); sheet.style.transform=""; sheetOpen=false; }
function toggleSheet(){ sheetOpen ? closeSheet() : openSheet(); }

// Pointer-drag on the handle/header. Follows the finger, then snaps.
(function(){
  const head = $("#sheetHead");
  let dragging=false, startY=0, startOffset=0, lastY=0, moved=false;

  function currentOffset(){
    // How far the sheet is pushed down from fully-open (0 = open, PEEK.. = collapsed)
    const h = sheetHeight();
    return sheetOpen ? 0 : Math.max(0, h - PEEK);
  }
  function onDown(e){
    dragging=true; moved=false;
    startY = e.clientY;
    lastY = e.clientY;
    startOffset = currentOffset();
    sheet.classList.add("dragging");
    head.setPointerCapture && head.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if(!dragging) return;
    const h = sheetHeight();
    const maxOffset = Math.max(0, h - PEEK);
    let off = startOffset + (e.clientY - startY);
    off = Math.max(0, Math.min(maxOffset, off));
    if(Math.abs(e.clientY - startY) > 4) moved=true;
    lastY = e.clientY;
    sheet.style.transform = `translateY(${off}px)`;
    e.preventDefault();
  }
  function onUp(e){
    if(!dragging) return;
    dragging=false;
    sheet.classList.remove("dragging");
    head.releasePointerCapture && head.releasePointerCapture(e.pointerId);
    if(!moved){ toggleSheet(); return; } // treat as a tap
    // Snap based on how far down it ended up.
    const h = sheetHeight();
    const maxOffset = Math.max(0, h - PEEK);
    const off = startOffset + (lastY - startY);
    (off < maxOffset/2) ? openSheet() : closeSheet();
  }
  head.addEventListener("pointerdown",onDown);
  head.addEventListener("pointermove",onMove);
  head.addEventListener("pointerup",onUp);
  head.addEventListener("pointercancel",onUp);
})();

/* ---------- Geolocation (opt-in) ---------- */
$("#locBtn").addEventListener("click",()=>{
  if(!navigator.geolocation){ toast("Geolocation isn't supported on this device."); return; }
  if(!window.isSecureContext && location.protocol!=="file:"){
    toast("Location needs a secure (HTTPS) page.");
  }
  toast("Locating you…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    map.setView([lat,lng],17);
    if(userMarker) map.removeLayer(userMarker);
    if(userCircle) map.removeLayer(userCircle);
    userCircle=L.circle([lat,lng],{radius:accuracy,color:"#4ea1ff",fillColor:"#4ea1ff",fillOpacity:.12,weight:1}).addTo(map);
    userMarker=L.circleMarker([lat,lng],{radius:8,color:"#fff",fillColor:"#4ea1ff",fillOpacity:1,weight:2}).addTo(map);
    loadNearby(lat,lng);
  },err=>{
    toast(err.code===1? "Location permission denied. You can still tap the map."
      : "Couldn't get your location. Tap the map instead.");
  },{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
});

/* ---------- Tap map to pick a block ---------- */
map.on("click",e=>{ loadNearby(e.latlng.lat,e.latlng.lng); });

/* ---------- Calendar modal ---------- */
function renderCal(filter=""){
  const f=filter.trim().toLowerCase();
  const now=iso(new Date());
  const list = SUSPENSIONS_2026
    .filter(s=>!f || s[1].toLowerCase().includes(f) ||
      new Date(s[0]+"T12:00").toLocaleDateString("en-US",{month:"long"}).toLowerCase().includes(f))
    .sort((a,b)=>a[0].localeCompare(b[0]));
  $("#calList").innerHTML = list.map(s=>{
    const d=new Date(s[0]+"T12:00");
    const past = s[0]<now;
    const isToday = s[0]===now;
    return `<div class="cal-item ${past?'past':''}">
      <span class="date">${d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
      <span>${esc(s[1])}${isToday?' <span class="badge b-good">Today</span>':''}</span>
    </div>`;
  }).join("") || '<div class="muted">No matches.</div>';
}
$("#searchBtn").addEventListener("click",()=>{$("#calModal").classList.add("show");renderCal($("#calSearch").value);$("#calSearch").focus();});
$("#calClose").addEventListener("click",()=>$("#calModal").classList.remove("show"));
$("#calModal").addEventListener("click",e=>{if(e.target.id==="calModal")$("#calModal").classList.remove("show");});
$("#calSearch").addEventListener("input",e=>renderCal(e.target.value));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#calModal").classList.remove("show");});

/* ---------- init ---------- */
renderToday();
openSheet();
</script>
